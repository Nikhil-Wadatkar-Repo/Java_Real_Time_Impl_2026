spring:
  datasource:
    url: jdbc:h2:mem:department_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false
    config:
      enabled: false
eureka:
  client:
    enabled: false
