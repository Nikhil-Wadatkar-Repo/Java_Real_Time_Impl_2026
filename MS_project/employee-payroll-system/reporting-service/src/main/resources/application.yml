server:
  port: 8087

spring:
  application:
    name: reporting-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://localhost:5432/reporting_db
    username: ${DB_USERNAME:reporting_user}
    password: ${DB_PASSWORD:reporting_pass}
    hikari:
      pool-name: reporting-hikari-pool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

feign:
  client:
    config:
      payroll-service:
        connect-timeout: 2000
        read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.enterprise.payroll.reporting: INFO
