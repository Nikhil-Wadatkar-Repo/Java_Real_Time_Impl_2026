server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      server:
        webflux:
          routes:
            - id: employee-service
              uri: lb://EMPLOYEE-SERVICE
              predicates:
                - Path=/api/employees/**
              filters:
                - StripPrefix=1
            - id: department-service
              uri: lb://DEPARTMENT-SERVICE
              predicates:
                - Path=/api/departments/**
              filters:
                - StripPrefix=1
            - id: project-service
              uri: lb://PROJECT-SERVICE
              predicates:
                - Path=/api/projects/**
              filters:
                - StripPrefix=1
            - id: attendance-service
              uri: lb://ATTENDANCE-SERVICE
              predicates:
                - Path=/api/attendance/**
              filters:
                - StripPrefix=1
            - id: payroll-service
              uri: lb://PAYROLL-SERVICE
              predicates:
                - Path=/api/payroll/**
              filters:
                - StripPrefix=1
            - id: reporting-service
              uri: lb://REPORTING-SERVICE
              predicates:
                - Path=/api/reports/**
              filters:
                - StripPrefix=1
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
