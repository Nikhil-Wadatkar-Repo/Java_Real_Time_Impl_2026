server:
  port: 8084

spring:
  application:
    name: attendance-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://localhost:5432/attendance_db
    username: ${DB_USERNAME:attendance_user}
    password: ${DB_PASSWORD:attendance_pass}
    hikari:
      pool-name: attendance-hikari-pool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

feign:
  client:
    config:
      employee-service:
        connect-timeout: 2000
        read-timeout: 3000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.enterprise.payroll.attendance: INFO
