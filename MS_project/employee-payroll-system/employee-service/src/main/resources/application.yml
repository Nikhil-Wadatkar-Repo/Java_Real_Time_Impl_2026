server:
  port: 8081

spring:
  application:
    name: employee-service
  # spring-cloud-starter-config on the classpath makes this import mandatory
  # (Spring Cloud Config Client refuses to start otherwise). "optional:" means
  # the service still starts standalone if config-server isn't up yet -
  # config-server centralization is wired properly in Phase 6.
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://localhost:5432/employee_db
    username: ${DB_USERNAME:employee_user}
    password: ${DB_PASSWORD:employee_pass}
    hikari:
      pool-name: employee-hikari-pool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Bounded timeouts only for now, so a slow/unreachable department-service
# fails fast instead of hanging an employee create/update indefinitely.
# Retry, circuit breaker and fallback are layered on top of this client in
# Phase 9 (Resilience4j) - deliberately not duplicated here.
feign:
  client:
    config:
      department-service:
        connect-timeout: 2000
        read-timeout: 3000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.enterprise.payroll.employee: INFO
