#To connect to docker image of mysql
spring.datasource.url=jdbc:mysql://docker-mysql:3306/mydb
spring.datasource.username=root
spring.datasource.password=test1234

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#for local
#server.port=9091
#for Elastic bean stalk
server.port=5000

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
# Specifies the database platform variant
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Controls the DDL validation and generation strategy
# Options: update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=update

# Enable this to see executed SQL queries in your console (useful for development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true